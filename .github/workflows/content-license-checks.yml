name: Content license checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tool-tests:
    name: Tool tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run unit tests for tools/
        run: python3 -m unittest discover -s tools/tests -v

  dialogue-in-code:
    name: No dialogue text in GDScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check GDScript files for Korean string literals
        run: python3 tools/check_dialogue_in_code.py

  story-scripts:
    name: Story scripts compile and are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint .dlg scripts and verify compiled output
        run: python3 tools/storyc.py --check

  pixel-art:
    name: Pixel art PNGs match their text sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Render assets/original/art/src and compare
        run: python3 tools/pixelart.py --check
