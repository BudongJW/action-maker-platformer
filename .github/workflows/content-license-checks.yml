name: Content license checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tool-tests:
    name: Tool tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run unit tests for tools/
        run: python3 -m unittest discover -s tools/tests -v

  dialogue-in-code:
    name: No dialogue text in GDScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check GDScript files for Korean string literals
        run: python3 tools/check_dialogue_in_code.py

  private-story:
    name: Private story files are not tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fail if anything under assets/original/story or assets/original/characters is tracked
        run: |
          tracked="$(git ls-files assets/original/story assets/original/characters)"
          if [ -n "$tracked" ]; then
            echo "These files are private story content and must not be committed:"
            echo "$tracked"
            exit 1
          fi
          echo "OK: no private story files tracked."

  story-scripts:
    name: Story scripts compile and are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint .dlg scripts and verify compiled output
        run: python3 tools/storyc.py --check

  story-runtime:
    name: Story runtime tests (Godot headless)
    runs-on: ubuntu-latest
    env:
      # ACTION GAME MAKER G is built on Godot 4.7.0.
      GODOT_VERSION: 4.7-stable
    steps:
      - uses: actions/checkout@v5

      - name: Download and verify Godot
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          zip="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          mkdir -p "$RUNNER_TEMP/godot" && cd "$RUNNER_TEMP/godot"
          curl -fsSL -o "$zip" "$base/$zip"
          curl -fsSL -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          grep " ${zip}\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip"
          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Run GDScript runtime tests
        run: python3 tools/run_godot_tests.py --require-godot
